version: '3.8'

services:
  salesbot:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
